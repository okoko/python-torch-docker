# This requires
# vars.DOCKERHUB_USERNAME for the result image account
# secrets.DOCKERHUB_USERNAME for the account that pushes the image
# secrets.DOCKERHUB_TOKEN for the account password that pushes the image

name: Docker
on:
  push:
    branches:
    - main
  # We want to monthly update the base image for security
  # TODO Can we avoid building the same image?
  schedule:
    # min hour dom month dow
    - cron: '42 3 2 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ case(matrix.platform == 'linux/arm64', 'ubuntu-24.04-arm', 'ubuntu-24.04') }}
    strategy:
      matrix:
        torch: ['2.3.1']
        torch-wheel-tag: ['2.3.1']
        torchvision: ['0.18.1']
        python: ['3.11.17', '3.11.17-slim']
        index: [cu126]
        platform: [linux/amd64, linux/arm64]
        include:
        - torch: '2.3.1'
          python: '3.11.17'
          index: cpu
          platform: linux/amd64
    permissions:
      contents: read
    steps:
    - id: created
      run: echo "created=$(date --utc +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Log in to Docker Hub
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      if: github.ref == 'refs/heads/main'
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      id: build-push
      with:
        context: .
        build-args: |
          CREATED=${{ steps.created.outputs.created }}
          SOURCE_COMMIT=${{ github.sha }}
          PYTHON=${{ matrix.python }}
          TORCH=${{ matrix.torch }}
          TORCH_REQUIREMENT=${{ matrix.url || format('torch=={0}', matrix.torch) }}
          TORCH_WHEEL_SOURCE=${{ case(matrix.torch-wheel-tag, format('{0}/torch-wheels:{1}', vars.DOCKERHUB_USERNAME, matrix.torch-wheel-tag), 'scratch') }}
          TORCHVISION_WHEEL_SOURCE=${{ case(matrix.torchvision, format('{0}/torchvision-wheels:{1}', vars.DOCKERHUB_USERNAME, matrix.torchvision), 'scratch') }}
          EXTRA_INDEX_URL=${{ matrix.extra-index-url || format('https://download.pytorch.org/whl/{0}/', matrix.index) }}
          CONSTRAINTS=constraints-${{ matrix.torch }}.txt
        outputs: |
          type=image,dangling-name-prefix=${{ vars.DOCKERHUB_USERNAME }}/python-torch,push=true
        # https://docs.docker.com/build/ci/github-actions/cache/
        cache-from: type=gha,scope=${{ matrix.torch }}-${{ matrix.python }}
        cache-to: type=gha,scope=${{ matrix.torch }}-${{ matrix.python }},mode=max
        platforms: ${{ matrix.platform }}

    - name: Write the image digest for artifact
      id: write-image-digest
      run: |
        MATRIX="${{ matrix.torch }},${{ matrix.index || '' }},${{ matrix.python }},${PLATFORM#*/}"
        echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
        echo "Image digest for $MATRIX $DIGEST" >> $GITHUB_STEP_SUMMARY
        FILENAME=$RUNNER_TEMP/image-digest-$MATRIX.txt
        echo "$DIGEST" >> $FILENAME
        echo "filename=$FILENAME" >> $GITHUB_OUTPUT
      env:
        DIGEST: ${{ steps.build-push.outputs.digest }}
        PLATFORM: ${{ case(matrix.index != 'cpu', matrix.platform, '') }}

    - name: Save the image digest as artifact
      uses: actions/upload-artifact@v7
      with:
        name: image-digest-${{ steps.write-image-digest.outputs.matrix }}
        path: ${{ steps.write-image-digest.outputs.filename }}
        retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # For the tag creation
      id-token: write  # Needed for actions/attest build predicate
      attestations: write  # Needed for actions/attest attestation upload to repository
      artifact-metadata: write  # Needed for actions/attest artifact metadata storage records
    steps:
    - uses: actions/checkout@v7

    - name: Download the image digest artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: image-digest-*
        merge-multiple: true

    - name: Login to Docker Hub
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Merge platform images using manifest tool
      id: manifest
      shell: python
      run: |
        import merge
        merge.step()
      env:
        DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

    - name: Create attestation for the manifests
      uses: actions/attest@v4
      with:
        subject-checksums: ${{ steps.manifest.outputs.sha256sum }}
        push-to-registry: true

    # With org.opencontainers.image.source pointing to this repository Dockerfile FROM updates in pull requests can be scanned
    # if the commits have matching tags with the image.
    # https://github.blog/changelog/2023-04-13-dependabot-now-supports-fetching-release-notes-and-changelogs-for-docker-images/
    # https://octokit.github.io/rest.js/v19#git-create-ref
    # https://octokit.github.io/rest.js/v19#git-update-ref
    - name: Tag the commit or update tag
      if: github.ref == 'refs/heads/main'
      uses: actions/github-script@v9
      with:
        script: |
          for (const tag of JSON.parse(process.env.TAGS)) {
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
            } catch(e) {
              if (e.status === 422) {
                await github.rest.git.updateRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${tag}`,
                  sha: context.sha,
                  force: true,
                });
              }
            }
          }
      env:
        TAGS: ${{ steps.manifest.outputs.tags }}

  description:
    needs: merge
    # https://github.com/actions/runner-images/blob/main/images/ubuntu-slim/ubuntu-slim-Readme.md
    runs-on: ubuntu-slim
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read  # To checkout the README.md
    steps:
    - uses: actions/checkout@v7

    # Can not use Personal Access Token to update the README. Returns FORBIDDEN.
    - name: Docker Hub Description
      uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        repository: ${{ vars.DOCKERHUB_USERNAME }}/python-torch
